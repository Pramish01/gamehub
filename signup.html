<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Hub - Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./login-style.css">
</head>

<body>

    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container">

        <div class="login-wrapper">
            <div class="logo-section">
                <h1 class="logo">GAME HUB</h1>
                <p class="tagline">Join the Gaming Universe</p>
            </div>

            <div class="login-box">
                <h2 class="login-title">Create Account</h2>

                <form id="signup-form">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="your.email@example.com" required>
                    </div>

                    <div class="input-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Choose a username" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Min. 6 characters" required>
                    </div>

                    <button type="submit" class="login-btn">
                        <span class="btn-text">Create Account</span>
                        <span class="btn-icon">✨</span>
                    </button>
                </form>

                <div class="links-section">
                    <span style="color: rgba(255,255,255,0.6);">Already have an account?</span>
                    <a href="index.html" class="link signup-link">Sign In</a>
                </div>
            </div>
        </div>

    </div>

    <script>
        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (password.length < 6) {
                alert('Password must be at least 6 characters long');
                return;
            }
            
            // In a real app, you would send this to a server
            // For now, we'll just show success and redirect
            alert('Account created successfully! Please login.');
            window.location.href = 'index.html';
        });

        // Orb animation on mouse move
        document.addEventListener('mousemove', e => {
            document.querySelectorAll('.orb').forEach((orb, i) => {
                const speed = (i + 1) * 20;
                orb.style.transform = `translate(${e.clientX / speed}px, ${e.clientY / speed}px)`;
            });
        });
    </script>

</body>

</html>

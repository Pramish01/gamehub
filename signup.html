<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Hub - Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./login-style.css">
</head>

<body>

    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container">

        <div class="login-wrapper">
            <div class="logo-section">
                <h1 class="logo">GAME HUB</h1>
                <p class="tagline">Join the Gaming Universe</p>
            </div>

            <div class="login-box">
                <h2 class="login-title">Create Account</h2>

                <form id="signup-form">
                    <div class="name-row">
                        <div class="input-group">
                            <label for="firstname">FIRST NAME</label>
                            <input type="text" id="firstname" placeholder="John" required>
                        </div>

                        <div class="input-group">
                            <label for="lastname">LAST NAME</label>
                            <input type="text" id="lastname" placeholder="Doe" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" placeholder="gamer@example.com" required>
                    </div>

                    <div class="input-group">
                        <label for="username">USERNAME</label>
                        <input type="text" id="username" placeholder="Choose your gaming tag" required>
                    </div>

                    <div class="input-group">
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" placeholder="Create a strong password" required>
                    </div>

                    <div class="input-group">
                        <label for="confirm-password">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm-password" placeholder="Re-enter your password" required>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">I agree to the <a href="#">Terms & Conditions</a></label>
                    </div>

                    <button type="submit" class="login-btn">
                        <span class="btn-text">Create Account</span>
                        <span class="btn-icon">🎮</span>
                    </button>
                </form>

                <div class="links-section">
                    <span style="color: rgba(255,255,255,0.6);">Already have an account?</span>
                    <a href="index.html" class="link signup-link">Sign In</a>
                </div>
            </div>
        </div>

    </div>

    <script src="./signup-script.js"></script>

</body>

</html>

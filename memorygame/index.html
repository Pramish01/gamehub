<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Memory Quest</title>
    <link rel="stylesheet" href="style.css">
    <style>
                .back-to-hub {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #00f3ff 0%, #0ea5e9 100%);
            color: #0a0e27;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 0.95em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 243, 255, 0.3);
            z-index: 1000;
            font-family: "Segoe UI", sans-serif;
        }

        .back-to-hub:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 243, 255, 0.5);
        }

        .back-to-hub:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
        <button class="back-to-hub" onclick="window.location.href='../home.html'">
        ← Back to Hub
    </button>
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <div id="levelScreen" class="level-selection">
            <div class="game-header">
                <div class="title-section">
                    <h1>🌌 Cosmic Memory Quest</h1>
                    <p class="subtitle">Find the matching pairs across the galaxy!</p>
                </div>
            </div>
            
            <div class="difficulty-selector">
                <h2>Choose Your Challenge</h2>
                <div class="difficulty-buttons">
                    <button class="difficulty-btn" data-cards="12">
                        <span class="diff-icon">🌟</span>
                        <span class="diff-name">Novice</span>
                        <span class="diff-desc">12 Cards</span>
                    </button>
                    <button class="difficulty-btn" data-cards="16">
                        <span class="diff-icon">🚀</span>
                        <span class="diff-name">Explorer</span>
                        <span class="diff-desc">16 Cards</span>
                    </button>
                    <button class="difficulty-btn" data-cards="20">
                        <span class="diff-icon">🌌</span>
                        <span class="diff-name">Master</span>
                        <span class="diff-desc">20 Cards</span>
                    </button>
                </div>
            </div>
        </div>
        
        <div id="gameScreen" class="game-screen hidden">
            <div class="game-header">
                <div class="title-section">
                    <h1>🌌 Cosmic Memory Quest</h1>
                    <p class="subtitle">Find the matching pairs across the galaxy!</p>
                </div>
                
                <div class="stats">
                    <div class="stat-card">
                        <span class="stat-label">Flips</span>
                        <span class="stat-value" id="flipsCount">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Matches</span>
                        <span class="stat-value" id="matchesCount">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Time</span>
                        <span class="stat-value" id="timeCount">0s</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Record</span>
                        <span class="stat-value" id="recordCount">--</span>
                    </div>
                </div>
            </div>
            
            <div id="gameGrid" class="game-board"></div>
            
            <div class="game-controls">
                <button class="btn btn-primary" id="newGameBtn">New Game</button>
                <button class="btn btn-secondary" id="changeLevelBtn">Change Level</button>
            </div>
        </div>
    </div>
    
    <div id="victoryModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🎊 Victory!</h2>
            </div>
            <div class="modal-body">
                <p class="win-message">You've conquered the memory challenge!</p>
                
                <div class="final-stats">
                    <div class="final-stat">
                        <span class="final-label">Total Flips:</span>
                        <span class="final-value" id="finalFlips">0</span>
                    </div>
                    <div class="final-stat">
                        <span class="final-label">Time Taken:</span>
                        <span class="final-value" id="finalTime">0s</span>
                    </div>
                </div>
                
                <div id="recordBadge" class="new-record hidden">
                    🏆 NEW RECORD!
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="playAgainBtn">Play Again</button>
                <button class="btn btn-secondary" id="newChallengeBtn">New Challenge</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>

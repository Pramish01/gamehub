<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Back to Hub Button */
        .back-to-hub {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #00f3ff 0%, #0ea5e9 100%);
            color: #0a0e27;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 0.95em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 243, 255, 0.3);
            z-index: 1001;
            font-family: 'Space Grotesk', sans-serif;
        }

        .back-to-hub:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 243, 255, 0.5);
        }

        .back-to-hub:active {
            transform: translateY(0);
        }

        /* Fix body overflow and add top padding for back button */
        body {
            padding-top: 80px !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
        }

        /* Ensure container doesn't conflict */
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* CRITICAL FIX: Override game-board display to show as grid when active */
        .game-board {
            display: grid !important; /* Force grid display */
            gap: 20px;
            margin-bottom: 32px;
            perspective: 1000px;
            width: 100%;
        }

        /* When hidden, actually hide it */
        .game-board:empty {
            display: none !important;
        }

        /* Grid layouts for each difficulty */
        .game-board.easy {
            grid-template-columns: repeat(3, 1fr) !important;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .game-board.medium {
            grid-template-columns: repeat(4, 1fr) !important;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .game-board.hard {
            grid-template-columns: repeat(4, 1fr) !important;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Fix card display */
        .card {
            aspect-ratio: 1 / 1;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            isolation: isolate;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .card-front {
            background: linear-gradient(135deg, rgba(26, 31, 58, 0.95) 0%, rgba(16, 20, 40, 0.95) 100%);
            border: 2px solid rgba(0, 255, 136, 0.2);
            position: relative;
            overflow: hidden;
        }

        .card-front::before {
            content: '?';
            color: #00ff88;
            font-size: 4rem;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 
                0 0 20px rgba(0, 255, 136, 0.3),
                0 0 40px rgba(0, 255, 136, 0.3);
            position: relative;
            z-index: 1;
        }

        .card-back {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.1) 0%, rgba(0, 217, 255, 0.1) 100%);
            border: 2px solid #00ff88;
            transform: rotateY(180deg);
            box-shadow: 
                0 8px 32px rgba(0, 255, 136, 0.3),
                0 0 60px rgba(0, 255, 136, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            body {
                padding: 15px;
                padding-top: 80px !important;
            }

            .game-board.easy,
            .game-board.medium {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 12px;
            }

            .game-board.hard {
                grid-template-columns: repeat(4, 1fr) !important;
                gap: 10px;
            }

            .card-face {
                font-size: 2.5rem;
            }

            .card-front::before {
                font-size: 3rem;
            }
        }

        @media (max-width: 480px) {
            .card-face {
                font-size: 2rem;
            }

            .card-front::before {
                font-size: 2.5rem;
            }

            .game-board {
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <!-- Back to Hub Button -->
    <button class="back-to-hub" onclick="window.location.href='../home.html'">
        ← Back to Hub
    </button>

    <div class="container">
        <header class="game-header">
            <div class="title-section">
                <h1>🧠 Memory Game</h1>
                <p class="subtitle">Match all the pairs to win!</p>
            </div>
            
            <div class="stats">
                <div class="stat-card">
                    <span class="stat-label">Moves</span>
                    <span class="stat-value" id="moves">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Time</span>
                    <span class="stat-value" id="timer">0:00</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Best</span>
                    <span class="stat-value" id="bestScore">--</span>
                </div>
            </div>
        </header>

        <div class="difficulty-selector" id="difficultySelector">
            <h2>Choose Difficulty</h2>
            <div class="difficulty-buttons">
                <button class="difficulty-btn" data-pairs="6">
                    <span class="diff-icon">😊</span>
                    <span class="diff-name">Easy</span>
                    <span class="diff-desc">6 Pairs</span>
                </button>
                <button class="difficulty-btn" data-pairs="8">
                    <span class="diff-icon">😎</span>
                    <span class="diff-name">Medium</span>
                    <span class="diff-desc">8 Pairs</span>
                </button>
                <button class="difficulty-btn" data-pairs="10">
                    <span class="diff-icon">🤯</span>
                    <span class="diff-name">Hard</span>
                    <span class="diff-desc">10 Pairs</span>
                </button>
            </div>
        </div>

        <div class="game-board" id="gameBoard"></div>

        <div class="game-controls">
            <button class="btn btn-primary" id="newGameBtn">New Game</button>
            <button class="btn btn-secondary" id="resetBtn">Reset</button>
        </div>

        <!-- Win Modal -->
        <div class="modal hidden" id="winModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>🎉 Congratulations!</h2>
                </div>
                <div class="modal-body">
                    <p class="win-message">You've matched all the pairs!</p>
                    <div class="final-stats">
                        <div class="final-stat">
                            <span class="final-label">Moves:</span>
                            <span class="final-value" id="finalMoves">0</span>
                        </div>
                        <div class="final-stat">
                            <span class="final-label">Time:</span>
                            <span class="final-value" id="finalTime">0:00</span>
                        </div>
                    </div>
                    <p class="new-record hidden" id="newRecord">🏆 New Best Score!</p>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" id="playAgainBtn">Play Again</button>
                    <button class="btn btn-secondary" id="closeModalBtn">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

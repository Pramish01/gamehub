<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Runner</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Back to Hub Button */
        .back-to-hub {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #00f3ff 0%, #0ea5e9 100%);
            color: #0a0e27;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 0.95em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 243, 255, 0.3);
            z-index: 1000;
            font-family: "Segoe UI", sans-serif;
        }

        .back-to-hub:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 243, 255, 0.5);
        }

        .back-to-hub:active {
            transform: translateY(0);
        }

        /* Ensure no overflow */
        body {
            overflow: hidden;
            height: 100vh;
            padding: 12px;
        }

        .container {
            max-height: 95vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        canvas {
            flex: 1;
            min-height: 0;
            height: auto !important;
            max-height: calc(95vh - 200px);
        }
    </style>
</head>
<body>
    <!-- Back to Hub Button -->
    <button class="back-to-hub" onclick="window.location.href='../home.html'">
        ← Back to Hub
    </button>

    <div class="container">
        <div class="header">
            <h1>Maze Runner</h1>
            <div class="stats">
                <p>Time Left: <span id="timer">1:00</span></p>
                <p>Best: <span id="best">--</span>s</p>
            </div>
        </div>
        
        <canvas id="gameCanvas"></canvas>
        
        <div class="controls">
            <p>Reach the gold exit. Good Luck!!!</p>
            <div class="options">
                <label>
                    Difficulty
                    <select id="difficulty">
                        <option value="easy">Easy</option>
                        <option value="normal" selected>Normal</option>
                        <option value="hard">Hard</option>
                        <option value="expert">Expert</option>
                        <option value="impossible">Impossible</option>
                    </select>
                </label>
                <label>
                    Shape
                    <select id="shape">
                        <option value="square" selected>Square</option>
                        <option value="wide">Wide</option>
                        <option value="tall">Tall</option>
                        <option value="diamond">Diamond</option>
                    </select>
                </label>
                <label>
                    Volume
                    <input id="volume" type="range" min="0" max="1" step="0.05" value="1">
                </label>
            </div>
            <button id="restartBtn">New Maze</button>
        </div>
    </div>

    <div id="jumpscareOverlay" class="jumpscare" aria-hidden="true">
        <img id="jumpscareImg" src="dora.jpg" alt="">
    </div>

    <script src="app.js"></script>
</body>
</html>

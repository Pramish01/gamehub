<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Hub - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./login-style.css">
</head>

<body>

    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container">

        <div class="login-wrapper">
            <div class="logo-section">
                <h1 class="logo">GAME HUB</h1>
                <p class="tagline">Enter the Gaming Universe</p>
            </div>

            <div class="login-box">
                <h2 class="login-title">Sign In</h2>

                <form id="login-form">
                    <div class="input-group">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" placeholder="gamer@example.com" required>
                    </div>

                    <div class="input-group">
                        <label for="username">USERNAME</label>
                        <input type="text" id="username" placeholder="Your gaming tag" required>
                    </div>

                    <div class="input-group">
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="login-btn">
                        <span class="btn-text">Launch Game Hub</span>
                        <span class="btn-icon">🚀</span>
                    </button>
                </form>

                <div class="links-section">
                    <a href="forget.html" class="link">Forgot Password?</a>
                    <span class="separator">|</span>
                    <a href="signup.html" class="link signup-link">Create Account</a>
                </div>
            </div>
        </div>

    </div>

    <script src="./auth.js"></script>
    <script src="./login-script.js"></script>
</body>

</html>

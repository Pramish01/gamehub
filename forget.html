<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Hub - Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./login-style.css">
</head>

<body>

    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container">

        <div class="login-wrapper">
            <div class="logo-section">
                <h1 class="logo">GAME HUB</h1>
                <p class="tagline">Password Recovery</p>
            </div>

            <div class="login-box">
                <h2 class="login-title">Forgot Password?</h2>
                
                <div style="text-align: center; margin: 2rem 0;">
                    <p style="color: rgba(255,255,255,0.7); font-size: 1rem; margin-bottom: 1.5rem;">
                        Don't worry! It happens to the best gamers.
                    </p>
                    <div style="font-size: 4rem; margin: 1rem 0;">😅</div>
                    <p style="color: var(--neon-blue); font-size: 0.95rem;">
                        Contact support to reset your password
                    </p>
                </div>

                <div class="links-section" style="margin-top: 2rem; flex-direction: column; gap: 1rem;">
                    <a href="signup.html" class="link">Create New Account</a>
                    <span class="separator">•</span>
                    <a href="index.html" class="link signup-link">Back to Login</a>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Orb animation on mouse move
        document.addEventListener('mousemove', e => {
            document.querySelectorAll('.orb').forEach((orb, i) => {
                const speed = (i + 1) * 20;
                orb.style.transform = `translate(${e.clientX / speed}px, ${e.clientY / speed}px)`;
            });
        });
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Hub - Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./login-style.css">
</head>

<body>

    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container">

        <div class="login-wrapper">
            <div class="logo-section">
                <h1 class="logo">GAME HUB</h1>
                <p class="tagline">Enter the Gaming Universe</p>
            </div>

            <div class="login-box">
                <h2 class="login-title">Forgot Password?</h2>
                
                <div class="forgot-text">
                    <p>No worries! Enter your email and we'll send you a reset link.</p>
                    <span class="forgot-icon">🔒</span>
                </div>

                <form id="forgot-form">
                    <div class="input-group">
                        <label for="email">EMAIL ADDRESS</label>
                        <input type="email" id="email" placeholder="gamer@example.com" required>
                    </div>

                    <button type="submit" class="login-btn">
                        <span class="btn-text">Send Reset Link</span>
                        <span class="btn-icon">📧</span>
                    </button>
                </form>

                <div class="links-section">
                    <a href="index.html" class="link">Back to Sign In</a>
                    <span class="separator">|</span>
                    <a href="signup.html" class="link signup-link">Create Account</a>
                </div>
            </div>
        </div>

    </div>

    <script>
        document.getElementById('forgot-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            
            if (email) {
                // In a real app, you would send this to a server
                alert('Password reset link has been sent to ' + email);
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            }
        });

        // Orb animation on mouse move
        document.addEventListener('mousemove', e => {
            document.querySelectorAll('.orb').forEach((orb, i) => {
                const speed = (i + 1) * 30;
                const x = (e.clientX / speed);
                const y = (e.clientY / speed);
                orb.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>

</body>

</html>
